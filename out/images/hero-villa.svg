<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4dc"/>
      <stop offset="45%" stop-color="#d4cfc4"/>
      <stop offset="100%" stop-color="#b8b2a6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f2"/>
      <stop offset="100%" stop-color="#c9c4ba"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a857c"/>
      <stop offset="100%" stop-color="#5f5b53"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a39d92"/>
      <stop offset="100%" stop-color="#8a857b"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="1200" fill="url(#sky)"/>

  <!-- distant hills -->
  <path d="M0 760 Q 400 700 800 750 T 2000 740 V1200 H0 Z" fill="#c8c2b6" opacity="0.55"/>
  <path d="M0 820 Q 500 770 1000 815 T 2000 800 V1200 H0 Z" fill="#bab4a8" opacity="0.6"/>

  <!-- main villa slab -->
  <g>
    <!-- lower level -->
    <rect x="220" y="620" width="1560" height="420" fill="url(#stone)"/>
    <!-- stone joints -->
    <g stroke="#7d786d" stroke-width="2" opacity="0.35">
      <line x1="220" y1="700" x2="1780" y2="700"/>
      <line x1="220" y1="790" x2="1780" y2="790"/>
      <line x1="220" y1="880" x2="1780" y2="880"/>
      <line x1="220" y1="960" x2="1780" y2="960"/>
   </g>

    <!-- upper cantilevered volume -->
    <rect x="380" y="260" width="1240" height="360" fill="url(#glass)"/>
    <rect x="380" y="260" width="1240" height="360" fill="none" stroke="#9a9488" stroke-width="3"/>

    <!-- floor-to-ceiling mullions -->
    <g stroke="#7d786d" stroke-width="3" opacity="0.7">
      <line x1="380" y1="260" x2="380" y2="620"/>
      <line x1="490" y1="260" x2="490" y2="620"/>
      <line x1="600" y1="260" x2="600" y2="620"/>
      <line x1="710" y1="260" x2="710" y2="620"/>
      <line x1="820" y1="260" x2="820" y2="620"/>
      <line x1="930" y1="260" x2="930" y2="620"/>
      <line x1="1040" y1="260" x2="1040" y2="620"/>
      <line x1="1150" y1="260" x2="1150" y2="620"/>
      <line x1="1260" y1="260" x2="1260" y2="620"/>
      <line x1="1370" y1="260" x2="1370" y2="620"/>
      <line x1="1480" y1="260" x2="1480" y2="620"/>
      <line x1="1620" y1="260" x2="1620" y2="620"/>
    </g>

    <!-- darker glass reflection panel -->
    <rect x="1040" y="260" width="120" height="360" fill="url(#glassDark)" opacity="0.55"/>
    <rect x="490" y="260" width="110" height="360" fill="url(#glassDark)" opacity="0.35"/>

    <!-- slab band between floors -->
    <rect x="220" y="600" width="1560" height="24" fill="#8a857b"/>
    <rect x="200" y="250" width="1600" height="14" fill="#8f897d"/>

    <!-- terrace overhang -->
    <rect x="180" y="580" width="240" height="12" fill="#8a857b"/>
    <rect x="1600" y="580" width="220" height="12" fill="#8a857b"/>

    <!-- pool reflection -->
    <rect x="700" y="1040" width="900" height="160" fill="#9fb3ac" opacity="0.8"/>
    <rect x="700" y="1040" width="900" height="160" fill="none" stroke="#8a9a94" stroke-width="3"/>
    <g stroke="#b7c8c1" stroke-width="2" opacity="0.7">
      <line x1="720" y1="1080" x2="1580" y2="1080"/>
      <line x1="720" y1="1120" x2="1580" y2="1120"/>
      <line x1="720" y1="1160" x2="1580" y2="1160"/>
    </g>

    <!-- soft landscape -->
    <ellipse cx="420" cy="1060" rx="260" ry="60" fill="#a5a294" opacity="0.5"/>
    <ellipse cx="1750" cy="1080" rx="220" ry="50" fill="#a5a294" opacity="0.45"/>

    <!-- slim trees -->
    <g>
      <rect x="330" y="880" width="6" height="160" fill="#6f6a5f"/>
      <ellipse cx="333" cy="860" rx="55" ry="90" fill="#8c9382" opacity="0.8"/>
      <rect x="1660" y="900" width="6" height="140" fill="#6f6a5f"/>
      <ellipse cx="1663" cy="880" rx="50" ry="85" fill="#8c9382" opacity="0.8"/>
    </g>
  </g>
</svg>
