<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#3a2f10" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#14120c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#2a220c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d97a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8a6d1f" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="goldFaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#d4af37" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Dark charcoal base (#0A0A0C) -->
  <rect width="1920" height="1080" fill="#0a0a0c"/>

  <!-- Subtle engineering grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Ambient gold glows -->
  <rect width="1920" height="1080" fill="url(#glowTop)"/>
  <rect width="1920" height="1080" fill="url(#glowBottom)"/>

  <!-- Abstract golden elevation lines (elevator shafts / architectural arcs) -->
  <g fill="none" stroke="url(#gold)" stroke-width="2">
    <path d="M-100 860 Q 480 520 960 700 T 2020 560"/>
    <path d="M-100 940 Q 560 640 1040 810 T 2020 680" stroke="url(#goldFaint)" stroke-width="1.5"/>
    <path d="M-100 300 Q 640 120 1120 260 T 2020 140" stroke="url(#goldFaint)" stroke-width="1.5"/>
  </g>

  <!-- Golden vertical shaft lines -->
  <g stroke="url(#gold)" stroke-width="1.5">
    <line x1="240" y1="0" x2="240" y2="1080" stroke-opacity="0.10"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke-opacity="0.07"/>
    <line x1="1680" y1="0" x2="1680" y2="1080" stroke-opacity="0.10"/>
  </g>

  <!-- Node accents on the main curve -->
  <g fill="#d4af37">
    <circle cx="480" cy="568" r="5" fill-opacity="0.8"/>
    <circle cx="960" cy="700" r="6" fill-opacity="0.9"/>
    <circle cx="1440" cy="606" r="5" fill-opacity="0.8"/>
  </g>
  <g fill="none" stroke="#d4af37" stroke-opacity="0.35">
    <circle cx="960" cy="700" r="16" stroke-width="1.5"/>
  </g>

  <!-- Soft vignette -->
  <rect width="1920" height="1080" fill="none"/>
</svg>
